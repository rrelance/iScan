name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scankit-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test --package-path ios/ScanKit

  build-ipa:
    needs: scankit-tests
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen ldid
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project iScan.xcodeproj -scheme iScan -sdk iphoneos \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 50
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/iScan.app Payload/
          ldid -Sios/iScan.entitlements Payload/iScan.app/iScan
          zip -qry iScan.ipa Payload
          ls -l iScan.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: iScan-ipa
          path: iScan.ipa
      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease --title nightly --notes "Rolling build of main" --target "$GITHUB_SHA"
          gh release upload nightly iScan.ipa --clobber
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" iScan.ipa --title "$GITHUB_REF_NAME"
